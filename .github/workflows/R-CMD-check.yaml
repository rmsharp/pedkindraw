# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# Copied from nprcgenekeepr's .github/workflows/R-CMD-check.yaml (commit
# 617420377): the same five jobs. Its three Chrome set-up steps came with
# pedkindraw's renderer (Phase 9), for the browser tests; their comments name
# nprcgenekeepr's files and sessions.
on:
  push:
    branches: [main, master]
    # A push that changes ONLY these files starts no run.
    paths-ignore:
      - CLAUDE.md
      - methodology/**
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Provision a pinned, reproducible Chrome-for-Testing binary for chromote
      # (mirrors shinytest2.yaml's own fix for an analogous flake -- BACKLOG.md
      # Housekeeping item, found S616/S618): chromote's own ambient Chrome
      # discovery is unreliable across this job's runner images, observed
      # failing as launch_chrome()/startup() abort (ubuntu-latest) and "Chrome
      # debugging port not open after 10 seconds" (windows-latest).
      #
      # Skipped on macos-latest (if: guard below), which reverts to ambient/
      # unpinned Chrome discovery instead: the pinned binary's freshly-
      # launched ChromoteSession hangs on its internal Runtime.evaluate
      # bootstrap probe there specifically -- NOT simple cold-start latency,
      # since raising chromote's default_timeout to 60s
      # (helper-live-render-positions.R) did NOT resolve it on a real CI push
      # (run 32417985922, still timed out after the full 60s, 3/3 identical
      # failures). Ambient Chrome discovery is already proven green on
      # macos-latest (S616's own run) -- this pin's original rationale above
      # never named macos-latest as needing it in the first place (found
      # S618, fallback applied S619, 2026-08-20).
      - name: Set up Chrome
        if: ${{ matrix.config.os != 'macos-latest' }}
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          install-dependencies: true

      # chromote::find_chrome() honours CHROMOTE_CHROME first; point it at the
      # action's installed binary (its name is not guaranteed to be on PATH).
      # shell: bash is required here -- unlike shinytest2.yaml (ubuntu-only,
      # where bash is the OS default), this job's matrix includes
      # windows-latest, whose run: default shell is PowerShell, under which
      # this bash-syntax redirect silently no-ops (confirmed live, S618).
      - name: Point chromote at the installed Chrome
        if: ${{ matrix.config.os != 'macos-latest' }}
        run: echo "CHROMOTE_CHROME=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
        shell: bash

      - name: Assert Chrome is resolvable by chromote
        if: ${{ matrix.config.os != 'macos-latest' }}
        run: |
          chrome <- Sys.getenv("CHROMOTE_CHROME")
          cat("CHROMOTE_CHROME =", chrome, "\n")
          found <- chromote::find_chrome()
          cat("chromote::find_chrome() =", if (is.null(found)) "<NULL>" else found, "\n")
          if (length(found) != 1L || !nzchar(found) || !file.exists(found)) {
            stop("Chrome not resolvable by chromote: ",
                 if (is.null(found)) "NULL" else found)
          }
        shell: Rscript {0}

      # Backlog item "A Windows job that does not end after its tests finish"
      # (S69 on): the Windows job's tests finish (proc.time() printed) and R
      # never exits, so the step ran until cancelled. The limit ends such a
      # hang as a failure, and the next step still runs (S91).
      - uses: r-lib/actions/check-r-package@v2
        timeout-minutes: ${{ matrix.config.os == 'windows-latest' && 35 || 360 }}
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # Diagnostics for the same item (S91): what is still running after the
      # check step, with each process's parent and command line, and each R
      # process's thread stacks, read by Microsoft's console debugger (cdb)
      # and by Rtools' gdb where each is found. Changes nothing.
      - name: Show what is still running (Windows)
        if: ${{ always() && matrix.config.os == 'windows-latest' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          $names = '^(Rterm|Rcmd|Rscript|R|cmd|conhost|chrome|supervisor|px)\.exe$'
          $procs = Get-CimInstance Win32_Process |
            Where-Object { $_.Name -match $names } |
            Sort-Object CreationDate
          $procs | Format-Table -AutoSize -Wrap ProcessId, ParentProcessId, Name, CreationDate, CommandLine | Out-String -Width 400
          $env:_NT_SYMBOL_PATH = 'srv*C:\sym*https://msdl.microsoft.com/download/symbols'
          $cdb = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Debuggers\x64\cdb.exe'
          $gdb = Get-ChildItem C:\rtools45 -Recurse -Filter gdb.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          foreach ($p in ($procs | Where-Object { $_.Name -eq 'Rterm.exe' })) {
            "==== Rterm $($p.ProcessId): $($p.CommandLine)"
            if (Test-Path $cdb) {
              & $cdb -pv -p $p.ProcessId -c 'lm; ~*k 60; q' 2>&1 | Out-String -Width 400
            } else {
              "cdb.exe not found at $cdb"
            }
            if ($gdb) {
              & $gdb.FullName -p $p.ProcessId -batch -ex 'info threads' -ex 'thread apply all bt 40' 2>&1 |
                Out-String -Width 400
            } else {
              'gdb.exe not found under C:\rtools45'
            }
          }
          Get-ChildItem check -Recurse -Filter 00check.log -ErrorAction SilentlyContinue |
            ForEach-Object { "==== $($_.FullName)"; Get-Content $_.FullName -Tail 30 }
