# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# (pkgdown.yaml) and nprcgenekeepr's .github/workflows/pkgdown.yaml. Builds
# the pkgdown site (plan R78; docs/planning/documentation-plan.md 5.6) and
# deploys it to the gh-pages branch, which GitHub Pages serves at
# https://rmsharp.github.io/pedkindraw/.
on:
  push:
    branches: [main, master]
    # A push that changes ONLY these files starts no run: the same list as
    # R-CMD-check.yaml's.
    paths-ignore:
      - CLAUDE.md
      - methodology/**
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push's run waits for the one before.
    concurrency:
      group: pkgdown
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # renv stays off on CI, so the job installs one Bioconductor release
      # (backlog :178, S98; R-CMD-check.yaml says why).
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # local::. installs the package itself, so the articles run today's
      # code (documentation plan M3: an older installed copy stopped them).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # pkgdown publishes every Markdown file at the root except README, NEWS
      # and LICENSE. These two are project notes, not package documentation,
      # so they are deleted from this runner's copy only (R78).
      - name: Leave the project notes off the site
        run: rm -f CLAUDE.md DIVERGENCE.md

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE, dest_dir = "pkgdown_site")
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: true
          branch: gh-pages
          folder: pkgdown_site
